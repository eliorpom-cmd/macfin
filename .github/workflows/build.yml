name: Build

on:
  push:
    branches: [main]
  pull_request:

# The build only reads the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Macfin.xcodeproj -scheme Macfin -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
